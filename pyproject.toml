[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dawl-core"
version = "0.1.0"
description = "DAWL network architecture and minimal weight-learning framework"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=1.13,<3", "numpy>=1.23,<3"]

[tool.setuptools.packages.find]
where = ["src"]
